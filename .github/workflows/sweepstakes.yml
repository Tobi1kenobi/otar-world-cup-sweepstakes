name: World Cup Biscuit Sweepstakes

on:
  schedule:
    # This cron runs at 08:00 UTC, Monday through Friday. 
    # During the summer, the UK is on BST (UTC+1), so 08:00 UTC = 09:00 UK time.
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # This allows you to click a button on GitHub to run it manually anytime.

jobs:
  run-sweepstakes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python your_script_name.py