name: World Cup Biscuit Sweepstakes

on:
  schedule:
    # Second participant group notifications (Mon-Fri 06:00 UTC).
    # - cron: '0 6 * * 1-5'
    # # Weekly second-group leaderboard email (Tuesday 06:30 UTC).
    # - cron: '30 6 * * 2'
    # # Weekly leaderboard email (Tuesday 13:00 UTC).
    # - cron: '0 13 * * 2'
    # # Primary participant group notifications (Mon-Fri 08:00 UTC).
    # - cron: '0 8 * * 1-5'
  workflow_dispatch:
    # This allows you to click a button on GitHub to run it manually anytime.
    inputs:
      dry_run:
        description: 'Dry run: Set true to preview notifications without sending email or updating state.json'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      leaderboard:
        description: 'Leaderboard mode: generate ranked cookies with movement and milestone deltas'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      participants_file:
        description: 'Participant file to use for this run'
        required: false
        default: assigned_participants.tsv
        type: choice
        options:
          - assigned_participants_real.tsv
          - assigned_participants_second_group.tsv
          - assigned_participants.tsv

jobs:
  run-sweepstakes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Resolve runtime settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '' }}
          INPUT_LEADERBOARD: ${{ github.event_name == 'workflow_dispatch' && inputs.leaderboard || '' }}
          INPUT_PARTICIPANTS_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.participants_file || '' }}
        run: |
          PARTICIPANTS_FILE="assigned_participants_real.tsv"
          DRY_RUN=""
          LEADERBOARD=""
          STATE_FILE="state.json"
          LEADERBOARD_STATE_FILE="leaderboard_state_primary.json"

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              '0 6 * * 1-5')
                PARTICIPANTS_FILE="assigned_participants_second_group.tsv"
                STATE_FILE="state_second_group.json"
                LEADERBOARD_STATE_FILE="leaderboard_state_second_group.json"
                ;;
              '30 6 * * 2')
                PARTICIPANTS_FILE="assigned_participants_second_group.tsv"
                STATE_FILE="state_second_group.json"
                LEADERBOARD="1"
                LEADERBOARD_STATE_FILE="leaderboard_state_second_group.json"
                ;;
              '0 13 * * 2')
                PARTICIPANTS_FILE="assigned_participants_real.tsv"
                LEADERBOARD="1"
                LEADERBOARD_STATE_FILE="leaderboard_state_primary.json"
                ;;
              '0 8 * * 1-5')
                PARTICIPANTS_FILE="assigned_participants_real.tsv"
                LEADERBOARD_STATE_FILE="leaderboard_state_primary.json"
                ;;
              *)
                echo "Unsupported schedule: $EVENT_SCHEDULE" >&2
                exit 1
                ;;
            esac
          else
            PARTICIPANTS_FILE="$INPUT_PARTICIPANTS_FILE"
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              DRY_RUN="1"
            fi
            if [ "$INPUT_LEADERBOARD" = "true" ]; then
              LEADERBOARD="1"
            fi
            if [ "$PARTICIPANTS_FILE" = "assigned_participants_second_group.tsv" ]; then
              STATE_FILE="state_second_group.json"
              LEADERBOARD_STATE_FILE="leaderboard_state_second_group.json"
            else
              LEADERBOARD_STATE_FILE="leaderboard_state_primary.json"
            fi
          fi

          echo "PARTICIPANTS_FILE=$PARTICIPANTS_FILE" >> "$GITHUB_ENV"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "LEADERBOARD=$LEADERBOARD" >> "$GITHUB_ENV"
          echo "STATE_FILE=$STATE_FILE" >> "$GITHUB_ENV"
          echo "LEADERBOARD_STATE_FILE=$LEADERBOARD_STATE_FILE" >> "$GITHUB_ENV"

      - name: Create private participants file for primary-group runs
        if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '0 13 * * 2' || github.event.schedule == '0 8 * * 1-5')) || (github.event_name == 'workflow_dispatch' && inputs.participants_file == 'assigned_participants_real.tsv') }}
        env:
          PARTICIPANTS_REAL_TSV: ${{ secrets.PARTICIPANTS_REAL_TSV }}
        run: |
          if [ -z "$PARTICIPANTS_REAL_TSV" ]; then
            echo "Secret PARTICIPANTS_REAL_TSV is required when running with assigned_participants_real.tsv." >&2
            exit 1
          fi
          printf '%s' "$PARTICIPANTS_REAL_TSV" > assigned_participants_real.tsv
          if ! awk -F '\t' 'NR == 1 { exit !(NF >= 6) }' assigned_participants_real.tsv; then
            echo "Secret PARTICIPANTS_REAL_TSV must be raw TSV content with at least 6 tab-separated columns in the header." >&2
            exit 1
          fi

      - name: Create private participants file for second-group runs
        if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '0 6 * * 1-5' || github.event.schedule == '30 6 * * 2')) || (github.event_name == 'workflow_dispatch' && inputs.participants_file == 'assigned_participants_second_group.tsv') }}
        env:
          PARTICIPANTS_SECOND_GROUP_TSV: ${{ secrets.PARTICIPANTS_SECOND_GROUP_TSV }}
        run: |
          if [ -z "$PARTICIPANTS_SECOND_GROUP_TSV" ]; then
            echo "Secret PARTICIPANTS_SECOND_GROUP_TSV is required when running with assigned_participants_second_group.tsv." >&2
            exit 1
          fi
          printf '%s' "$PARTICIPANTS_SECOND_GROUP_TSV" > assigned_participants_second_group.tsv
          if ! awk -F '\t' 'NR == 1 { exit !(NF >= 6) }' assigned_participants_second_group.tsv; then
            echo "Secret PARTICIPANTS_SECOND_GROUP_TSV must be raw TSV content with at least 6 tab-separated columns in the header." >&2
            exit 1
          fi

      - name: Run script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          BCC_EMAIL: ${{ secrets.BCC_EMAIL }}
        run: python sweepstakes.py

      - name: Commit updated state
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          for state_file in state.json state_second_group.json leaderboard_state_primary.json leaderboard_state_second_group.json; do
            if [ -f "$state_file" ]; then
              git add "$state_file"
            fi
          done
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sweepstakes state" && git push)
