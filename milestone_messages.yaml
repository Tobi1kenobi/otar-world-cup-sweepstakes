# I define the custom lines for each winning milestone.
# Supported placeholders: {team}, {milestone}, {name}


Red Card: "🟥 Early bath! {team} saw RED in their latest match."
90+ Minute Goal: "⏱️ ABSOLUTE LIMBS! {team} just grabbed a dramatic 90+ minute goal!"
Own Goal: "🙈 Look away now... {team} just gifted the opposition an own goal."
First Two Teams to Extra Time: "⏳ Going the distance! {team} featured in the tournament's first extra-time battle."
Won Penalty Shootout: "🎯 Ice in their veins! Great news for {team} as they just won a penalty shootout."
Giant Killer (Beat Top 5): "🦁 WHAT A SCALP! {team} just knocked out one of the top 5 favorites! Giant killer alert!"
0-0 Boring Draw: "😴 Zzzzz... {team} was involved in an absolute 0-0 snorefest. At least you get a cookie."
Scored 4+ Goals: "💥 Stop, stop, they're already dead! {team} ran completely riot with 4+ goals!!"
Early Goal (First 5 mins): "⚡ Blink and you missed it! Early bird {team} scored in the first five minutes."
First Goal of Tournament: "🚀 Kicking off the World Cup with an absolute bang! {team} scored the first goal of the tournament!"
First Knockout Stage Goal: "🏆 The real tournament starts now. {team} just scored the first knockout-stage goal!"
Arsenal Player Goal: "🔴 TOBI'S ARSENAL BIAS IN FULL EFFECT! A premier league winner just scored for {team}!"
Max Group Points (9): "🔥 ON FIRE! {team} utterly dominated the group, finishing with a maximum 9 points!"
Zero Group Points (0): "🥶 Ouch. {team} is heading home with zero points. A truly historic stinker."